<title>Timaxo Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Cairo:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen app. Home shelf of pages -> crop with scan beam -> editor with tabs -> export sheet. Orange beam is the single signature motion. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface2:#E2E6EC; --ink:#0F1A2B; --ink2:#566175; --line:#D2D8E0;
  --accent:#E8501A; --accent-ink:#FFFFFF; --teal:#0E7C7B; --stage:#D8DDE4; --shadow:rgba(15,26,43,.14);
  --paper:#FBFAF6; --danger:#C62F2F;
  --fd:'Outfit','Cairo',system-ui,sans-serif;
  --fb:'Manrope','Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --dir:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1017; --surface:#151C26; --surface2:#1E2733; --ink:#EAEFF6; --ink2:#93A0B4; --line:#283344;
  --accent:#FF6B2C; --accent-ink:#1A0B03; --teal:#35C4C0; --stage:#070B10; --shadow:rgba(0,0,0,.5); --paper:#F3F1EA; --danger:#FF6B6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1017; --surface:#151C26; --surface2:#1E2733; --ink:#EAEFF6; --ink2:#93A0B4; --line:#283344;
  --accent:#FF6B2C; --accent-ink:#1A0B03; --teal:#35C4C0; --stage:#070B10; --shadow:rgba(0,0,0,.5); --paper:#F3F1EA; --danger:#FF6B6B; color-scheme:dark}
:root[dir="rtl"]{--dir:-1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--fb);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}
#app{position:relative;height:100%;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);opacity:0;visibility:hidden;pointer-events:none;
  transform:translateX(calc(var(--dir)*28px));transition:opacity .28s ease,transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s}
.view.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .28s ease,transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:60px}
.top .ttl{flex:1;min-width:0;font:700 17px/1.2 var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink);transition:background .15s,transform .15s}
.ib:active{transform:scale(.92)}
.ib:hover{background:var(--surface2)}
.btn{height:44px;padding:0 18px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);transition:transform .15s,background .15s,opacity .15s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{height:38px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* HOME */
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font:700 21px/1 var(--fd);letter-spacing:-.01em}
.brand b span{color:var(--accent)}
.lang{height:38px;min-width:46px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px}
.docrow{display:flex;align-items:center;gap:8px;padding:4px 16px 10px}
.docname{flex:1;min-width:0;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font:700 16px var(--fb);-webkit-user-select:text;user-select:text}
.fld .docname{flex:none}
.docname:focus{outline:2px solid var(--accent);border-color:transparent}
.count{font-size:13px;color:var(--ink2);padding:0 16px 8px;min-height:26px}
.shelf{flex:1;overflow:auto;padding:4px 16px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
.pg{position:relative;aspect-ratio:3/4;border-radius:12px;background:var(--surface);box-shadow:0 1px 0 var(--line),0 8px 20px -10px var(--shadow);overflow:hidden;display:block;transition:transform .2s}
.pg:active{transform:scale(.97)}
.pg img{width:100%;height:100%;object-fit:contain;display:block;background:var(--surface)}
.pg .num{position:absolute;inset-block-end:8px;inset-inline-start:8px;min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:var(--ink);color:var(--bg);font:700 12px/26px var(--fb);text-align:center;font-variant-numeric:tabular-nums}
.pg.fresh{animation:pop .55s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{0%{transform:translateY(24px) scale(.82);opacity:0}100%{transform:none;opacity:1}}
.add{aspect-ratio:3/4;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--ink2);transition:border-color .2s,color .2s}
.add:hover{border-color:var(--accent);color:var(--accent)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:12px 8px 0}
.empty h1{font:700 26px/1.15 var(--fd);margin:6px 0 0;text-wrap:balance}
.empty p{margin:0;color:var(--ink2);max-width:34ch;text-wrap:balance}
.demo{position:relative;width:176px;height:224px;margin-top:6px}
.sheet-d{position:absolute;inset:14px;border-radius:6px;background:var(--paper);transform:rotate(-4deg);box-shadow:0 18px 30px -14px var(--shadow);overflow:hidden;
  background-image:repeating-linear-gradient(#0000 0 15px,#0f1a2b1f 15px 17px);background-size:100% 100%;background-position:0 30px}
.sheet-d::before{content:"";position:absolute;inset-inline:14px;top:14px;height:16px;border-radius:3px;background:#0f1a2b;opacity:.8;width:46%}
.sheet-d .beam{opacity:1;animation:loop 2.6s cubic-bezier(.5,0,.3,1) infinite}
@keyframes loop{0%{top:-4%}55%{top:100%}100%{top:100%}}
.corner{position:absolute;width:26px;height:26px;border:3px solid var(--accent);border-radius:4px}
.corner.a{top:0;left:0;border-right:0;border-bottom:0}.corner.b{top:0;right:0;border-left:0;border-bottom:0}
.corner.c{bottom:0;left:0;border-right:0;border-top:0}.corner.d{bottom:0;right:0;border-left:0;border-top:0}
.beam{position:absolute;inset-inline:0;top:0;height:3px;background:var(--accent);opacity:0;pointer-events:none;box-shadow:0 0 22px 6px color-mix(in srgb,var(--accent) 60%,transparent)}
.beam::before{content:"";position:absolute;inset-inline:0;bottom:3px;height:70px;background:linear-gradient(to top,color-mix(in srgb,var(--accent) 30%,transparent),transparent)}
.beam.run{animation:sweep 1.15s cubic-bezier(.5,0,.3,1) forwards}
@keyframes sweep{0%{top:0;opacity:0}8%{opacity:1}90%{opacity:1}100%{top:calc(100% - 3px);opacity:0}}
.dock{display:flex;align-items:center;justify-content:space-around;gap:8px;padding:10px 16px 14px;background:var(--bg);border-top:1px solid var(--line)}
.dk{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px;padding:6px 8px;border-radius:14px;font-size:12px;font-weight:700;color:var(--ink2)}
.dk:hover{color:var(--ink)}
.dk[disabled]{opacity:.35;pointer-events:none}
.scanbtn{position:relative;width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 12px 26px -8px color-mix(in srgb,var(--accent) 70%,#000),0 0 0 6px var(--bg);transition:transform .18s}
.scanbtn:active{transform:scale(.92)}
.scanbtn svg{width:30px;height:30px}
.scanbtn::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ring 2.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.6}70%,100%{transform:scale(1.35);opacity:0}}
.scanlbl{margin-top:-18px}

/* CROP */
.stage{position:relative;flex:1;min-height:0;background:var(--stage);display:grid;place-items:center;overflow:hidden}
#cropBox{position:relative;box-shadow:0 20px 50px -20px #000a;overflow:visible;direction:ltr}
#cropCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cropSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;touch-action:none}
#cropSvg .mask{fill:rgba(6,10,16,.52);fill-rule:evenodd;transition:opacity .4s}
#cropSvg .quad{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
#cropSvg .dot{fill:#fff;stroke:var(--accent);stroke-width:3.5}
#cropSvg .hit{fill:transparent;cursor:grab}
#cropSvg .grp{opacity:0;transition:opacity .35s}
#cropSvg.in .grp{opacity:1}
#cropSvg.in .mask{opacity:1}
#cropSvg .mask{opacity:0}
.loupe{position:absolute;top:12px;width:104px;height:104px;border-radius:50%;overflow:hidden;border:3px solid var(--accent);background:#000;box-shadow:0 10px 24px #0008;opacity:0;transform:scale(.7);transition:opacity .15s,transform .2s;pointer-events:none;z-index:3}
.loupe.on{opacity:1;transform:none}
.loupe canvas{width:100%;height:100%;display:block}
.loupe::before,.loupe::after{content:"";position:absolute;background:var(--accent);opacity:.9}
.loupe::before{left:50%;top:38%;bottom:38%;width:2px;margin-left:-1px}
.loupe::after{top:50%;left:38%;right:38%;height:2px;margin-top:-1px}
.hint{position:absolute;inset-inline:16px;bottom:8px;text-align:center;font-size:13px;color:var(--ink2);pointer-events:none;transition:opacity .3s}
.cropbar{display:flex;align-items:center;gap:10px;padding:12px 16px calc(14px);background:var(--bg)}
.cropbar .btn.pri{flex:1}

/* EDIT */
#wrap{position:relative;direction:ltr;box-shadow:0 18px 44px -18px #000a;background:#fff;touch-action:none}
#wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none;cursor:crosshair}
.cmp{position:absolute;inset-block-end:10px;inset-inline-end:10px;height:34px;padding:0 12px;border-radius:17px;background:#0e1623d9;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;backdrop-filter:blur(6px);z-index:2}
.panel{background:var(--bg);border-top:1px solid var(--line);min-height:128px;padding:12px 16px 4px;display:flex;flex-direction:column;justify-content:center}
.panel[hidden]{display:none}
.row{display:flex;gap:10px;align-items:center}
.scroll{overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.scroll::-webkit-scrollbar{display:none}
.flt{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink2)}
.flt canvas{height:76px;width:auto;border-radius:8px;border:2px solid transparent;background:#fff;display:block;transition:border-color .15s,transform .2s}
.flt.on{color:var(--ink)}
.flt.on canvas{border-color:var(--accent);transform:translateY(-3px)}
.sld{display:grid;grid-template-columns:96px 1fr 38px;align-items:center;gap:10px;font-size:13px;font-weight:700;padding:3px 0}
.sld output{font-variant-numeric:tabular-nums;color:var(--ink2);text-align:end;font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;direction:ltr;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);margin-top:-9px;border:3px solid var(--bg);box-shadow:0 1px 4px var(--shadow)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.tool{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink2);transition:all .15s;position:relative}
.tool.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tool:active{transform:scale(.94)}
.sw{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line);transition:transform .15s}
.sw.on{transform:scale(1.18);box-shadow:0 0 0 2.5px var(--ink)}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{min-width:38px;height:34px;padding:0 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink2);transition:all .15s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.tbar{display:flex;gap:8px;align-items:flex-end;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line)}
.tbar textarea{flex:1;min-height:46px;max-height:110px;resize:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:11px 12px;-webkit-user-select:text;user-select:text}
.tbar[hidden]{display:none}
.pgact{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pa{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;padding:0 6px}
.pa:active{transform:scale(.96)}
.pa.warn.arm{background:var(--danger);color:#fff;border-color:var(--danger)}
.pa[disabled]{opacity:.35;pointer-events:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:12px;font-weight:700;color:var(--ink2);position:relative}
.tab.on{color:var(--accent)}
.tab::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent);transform:scaleX(0);transition:transform .25s}
.tab.on::before{transform:scaleX(1)}

/* SHEET */
.scrim{position:absolute;inset:0;background:#05080dA6;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s;z-index:20}
.scrim.on{opacity:1;visibility:visible;transition:opacity .3s}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:21;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 16px 18px;max-height:92%;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .42s cubic-bezier(.2,.8,.2,1),visibility 0s .42s;box-shadow:0 -20px 50px -20px #0008}
.sheet.on{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{font:700 20px/1.2 var(--fd);margin:0 0 12px}
.fld{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.fld>label,.fld>span.l{font-size:12px;font-weight:700;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:44px;height:38px;padding:0 14px;border-radius:12px;background:var(--surface2);font-weight:700;font-size:13px;transition:all .15s;font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);color:var(--bg)}
.note{font-size:12px;color:var(--ink2);margin:-4px 0 12px}
.savebtn{width:100%;height:54px;font-size:16px;position:relative;overflow:hidden}
.savebtn .bar{position:absolute;inset:0;background:color-mix(in srgb,#000 22%,transparent);transform-origin:left;transform:scaleX(0);transition:transform .25s}
[dir=rtl] .savebtn .bar{transform-origin:right}
.savebtn span{position:relative}
.fallback{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:14px;text-align:center;font-size:13px;color:var(--ink2)}
.fallback img{max-width:60%;max-height:240px;border-radius:8px;border:1px solid var(--line);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.fallback a{color:var(--accent);font-weight:700}
.toast{position:absolute;inset-inline:16px;bottom:96px;margin:auto;width:fit-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;opacity:0;transform:translateY(12px);transition:all .3s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.busy{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.busy.on{opacity:1;visibility:visible;transition:opacity .2s}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .scanbtn::after{display:none}
}
@media (max-height:620px){.panel{min-height:104px}.flt canvas{height:60px}}
</style>

// Install button
let dip=null;const top=document.querySelector('#vHome .top');
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const ib=document.createElement('button');ib.className='inst';ib.hidden=true;
const setIb=()=>{ib.textContent=ar()?'ثبّت التطبيق':'Install app';};setIb();
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
if(top&&!standalone){top.insertBefore(ib,document.getElementById('langBtn'));
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;ib.hidden=false;});
 if(ios)ib.hidden=false;
 ib.onclick=async()=>{if(dip){dip.prompt();await dip.userChoice;dip=null;ib.hidden=true;}
  else{const m=ar()?'من زر المشاركة اختر: إضافة إلى الشاشة الرئيسية':'Tap Share, then Add to Home Screen';const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3500);}};
 addEventListener('appinstalled',()=>{ib.hidden=true;});
 document.getElementById('langBtn')?.addEventListener('click',()=>setTimeout(setIb,50));}
// Haptics
const buzz=n=>navigator.vibrate&&navigator.vibrate(n);
['scanBtn','galBtn','cropGo','doneBtn','xGo'].forEach(id=>document.getElementById(id)?.addEventListener('click',()=>buzz(12)));
// Drag & drop + paste (desktop PWA)
const gal=document.getElementById('galIn'),dz=document.getElementById('dropzone');
const feed=files=>{const imgs=[...files].filter(f=>f.type.startsWith('image/'));if(!imgs.length||!gal)return;
 const dt=new DataTransfer();imgs.forEach(f=>dt.items.add(f));gal.files=dt.files;gal.dispatchEvent(new Event('change',{bubbles:true}));};
const dtxt=()=>{const d=document.getElementById('dzTxt');if(d)d.textContent=ar()?'أفلت الصور هنا للمسح':'Drop images to scan';};
let dc=0;
addEventListener('dragenter',e=>{if(!e.dataTransfer?.types?.includes('Files'))return;e.preventDefault();dc++;dtxt();dz.classList.add('on');});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('dragleave',()=>{dc=Math.max(0,dc-1);if(!dc)dz.classList.remove('on');});
addEventListener('drop',e=>{e.preventDefault();dc=0;dz.classList.remove('on');if(e.dataTransfer?.files?.length)feed(e.dataTransfer.files);});
addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])];if(fs.length)feed(fs);});
// Offline awareness
addEventListener('offline',()=>{const t=document.getElementById('toast');t.textContent=ar()?'أنت بدون إنترنت — التطبيق يعمل عادي':'Offline — everything still works';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500);});
})();

<style id="ui15">
/* ===== Timaxo 3.0 "Neon Scan" : aurora, glass, scan-beam motion ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
#vHome::before,#vHome::after{content:"";position:absolute;inset:-20%;z-index:0;pointer-events:none;will-change:transform}
#vHome::before{background:radial-gradient(38% 30% at 20% 22%,color-mix(in srgb,var(--accent) 34%,transparent),transparent 70%),radial-gradient(34% 28% at 82% 70%,color-mix(in srgb,var(--cyan) 26%,transparent),transparent 70%);animation:aur1 16s ease-in-out infinite alternate}
#vHome::after{background:radial-gradient(30% 26% at 70% 18%,color-mix(in srgb,var(--navy1) 40%,transparent),transparent 70%),radial-gradient(28% 24% at 14% 80%,color-mix(in srgb,var(--cyan) 18%,transparent),transparent 70%);animation:aur2 22s ease-in-out infinite alternate}
@keyframes aur1{to{transform:translate3d(8%,6%,0) rotate(8deg) scale(1.12)}}
@keyframes aur2{to{transform:translate3d(-7%,-5%,0) rotate(-10deg) scale(1.08)}}
#vHome>*{position:relative;z-index:1}
/* header: travelling beam + floating glowing logo */
#vHome .top::after{left:0;right:0;width:auto;height:2px;background:linear-gradient(90deg,transparent 0,transparent 35%,var(--cyan) 50%,transparent 65%,transparent 100%);background-size:250% 100%;animation:tbeam 3.6s linear infinite;box-shadow:0 0 14px 1px var(--cyan);opacity:1}
@keyframes tbeam{from{background-position:100% 0}to{background-position:-100% 0}}
#vHome .logo{animation:lfloat 5s ease-in-out infinite;box-shadow:0 0 0 1px rgba(120,220,255,.35),0 0 18px rgba(34,211,245,.55),0 6px 16px -4px rgba(27,99,240,.7)}
@keyframes lfloat{50%{transform:translateY(-2px) scale(1.05);box-shadow:0 0 0 1px rgba(120,220,255,.6),0 0 28px rgba(34,211,245,.85),0 8px 18px -4px rgba(27,99,240,.8)}}
/* glass dock + spinning conic ring on scan button */
.dock{background:color-mix(in srgb,var(--surface) 62%,transparent)!important;backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 18px 40px -16px var(--shadow),inset 0 1px 0 rgba(255,255,255,.18)}
.scanbtn::before{content:"";position:absolute;inset:-5px;border-radius:50%;z-index:-1;background:conic-gradient(from 0deg,var(--cyan),var(--accent),transparent 55%,var(--cyan));animation:spin 3s linear infinite;filter:blur(1.5px)}
.scanbtn{isolation:isolate}
.scanbtn svg{transition:transform .5s var(--ease)}.scanbtn:hover svg{transform:rotate(-12deg) scale(1.1)}
@keyframes spin{to{transform:rotate(360deg)}}
.dock button.dk{transition:transform .25s var(--ease),background .25s}.dock button.dk:active{transform:translateY(2px) scale(.94)}
/* page cards: glass edge, springy entrance, scan sweep on fresh page */
.pg{box-shadow:0 0 0 1px color-mix(in srgb,var(--cyan) 22%,var(--line)),0 14px 28px -14px var(--shadow);transition:transform .35s var(--ease),box-shadow .35s}
.pg:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 0 0 1px var(--cyan),0 20px 34px -14px rgba(34,211,245,.45)}
.pg .num{background:var(--grad);color:#031033}
.pg.fresh::after{content:"";position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(180deg,transparent,rgba(34,211,245,.55),transparent);border-bottom:2px solid var(--cyan);box-shadow:0 8px 24px rgba(34,211,245,.6);animation:psweep 1.1s var(--ease) 1 both;pointer-events:none}
@keyframes psweep{from{transform:translateY(-110%)}to{transform:translateY(260%);opacity:0}}
.grid.stag>*{animation:pop .6s var(--ease) both;animation-delay:calc(var(--i)*55ms)}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.88) rotate(2deg);filter:blur(6px)}}
.add{border:2px dashed color-mix(in srgb,var(--cyan) 55%,transparent)!important;animation:addp 2.6s ease-in-out infinite}
@keyframes addp{50%{box-shadow:0 0 22px rgba(34,211,245,.35)}}
/* buttons: sheen sweep */
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s var(--ease)}
.btn:hover::after,.btn:focus-visible::after{transform:translateX(120%)}
.btn:active{transform:scale(.95)}
.empty .demo{animation:lfloat 4.5s ease-in-out infinite}
/* screen transitions: blur+scale */
.view{transition:opacity .32s ease,transform .45s var(--ease),filter .32s ease,visibility 0s .45s!important;filter:blur(8px)}
.view.on{filter:none}
/* global scan-beam transition */
#sbeam{position:fixed;left:0;right:0;top:0;height:3px;z-index:9998;pointer-events:none;background:linear-gradient(90deg,transparent,var(--cyan),#fff,var(--cyan),transparent);box-shadow:0 0 22px 4px var(--cyan),0 0 60px 10px rgba(27,99,240,.5);opacity:0}
#sbeam.go{animation:sb .62s cubic-bezier(.5,0,.2,1)}
@keyframes sb{0%{opacity:1;transform:translateY(-4px)}85%{opacity:1}100%{opacity:0;transform:translateY(100vh)}}
/* splash */
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 45%,#0a2a7a55,transparent 70%),#000515;transition:opacity .6s ease,transform .6s var(--ease),filter .6s;touch-action:manipulation}
#splash.out{opacity:0;transform:scale(1.06);filter:blur(10px);pointer-events:none}
#splash .st{position:relative;width:min(78vw,340px);aspect-ratio:1}
#splash .st img{width:100%;height:100%;display:block;clip-path:inset(0 0 100% 0);animation:srev 1.15s cubic-bezier(.5,0,.3,1) .45s forwards,sglow 3s ease-in-out 1.6s infinite}
#splash .sb{position:absolute;left:-12%;right:-12%;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--cyan,#22D3F5),#fff,var(--cyan,#22D3F5),transparent);box-shadow:0 0 26px 6px #22d3f5,0 0 70px 14px #1b63f088;opacity:0;animation:sbm 1.15s cubic-bezier(.5,0,.3,1) .45s forwards}
#splash .c{position:absolute;width:15%;height:15%;border:4px solid #22d3f5;border-radius:6px;opacity:0;filter:drop-shadow(0 0 8px #22d3f5);animation:cin .7s var(--ease) .05s forwards}
#splash .c.a{left:5%;top:5%;border-right:0;border-bottom:0;--x:-60px;--y:-60px}#splash .c.b{right:5%;top:5%;border-left:0;border-bottom:0;--x:60px;--y:-60px}
#splash .c.c2{left:5%;bottom:30%;border-right:0;border-top:0;--x:-60px;--y:60px}#splash .c.d{right:5%;bottom:30%;border-left:0;border-top:0;--x:60px;--y:60px}
@keyframes cin{from{opacity:0;transform:translate(var(--x),var(--y)) scale(1.8)}to{opacity:1;transform:none}}
@keyframes srev{from{clip-path:inset(0 0 100% 0);filter:brightness(2) blur(4px)}to{clip-path:inset(0);filter:none}}
@keyframes sbm{0%{top:0;opacity:1}92%{opacity:1}100%{top:100%;opacity:0}}
@keyframes sglow{50%{filter:drop-shadow(0 0 22px rgba(34,211,245,.55))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}#splash{display:none}}
