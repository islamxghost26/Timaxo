name: Fetch vendor files
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix nested vendor path
        run: |
          if [ -d vendor/vendor/edge ]; then mkdir -p vendor/edge; cp -rn vendor/vendor/edge/. vendor/edge/; rm -rf vendor/vendor; fi
      - name: Download vendor files
        run: python3 vendor/fetch-vendor.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f vendor
          git diff --cached --quiet || git commit -m "vendor: add onnxruntime and tesseract files"
          git push
